services:


  ollama:
    image: ollama/ollama
    container_name: soc_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s


  ollama_pull:
    image: ollama/ollama
    container_name: soc_model_pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3"]
    restart: "no"


  soc_pipeline:
    image: python:3.11-slim
    container_name: soc_pipeline
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3
    command: >
      bash -c "pip install -r requirements.txt -q &&
               python main.py
                 --input  data/logs.json
                 --output data/results_docker.json
                 --limit  20"
    restart: "no"


  soc_evaluator:
    image: python:3.11-slim
    container_name: soc_evaluator
    depends_on:
      - soc_pipeline
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "pip install -r requirements.txt -q &&
               python evaluateur_complet.py
                 --input  data/results_docker.json
                 --output data/evaluation_report.json"
    restart: "no"

  
  soc_dashboard:
    image: python:3.11-slim
    container_name: soc_dashboard
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "pip install -r requirements.txt -q &&
               streamlit run dashboard_soc.py
                 --server.port 8501
                 --server.address 0.0.0.0
                 --server.headless true"
    restart: unless-stopped

volumes:
  ollama_models: